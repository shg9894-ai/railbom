<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1F4E79" />
    <meta name="description" content="철도차량 BOM·명칭도감·자재마스터 통합 관리" />

    <!-- favicon / 아이콘 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512.png" />

    <!-- iOS 홈화면 추가 지원 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KORAIL BOM" />

    <!-- 안드로이드 -->
    <meta name="mobile-web-app-capable" content="yes" />

    <title>철도차량 BOM</title>

    <!-- 일회성 SW/캐시 정리: 옛 PWA 캐시 데드락 부수기 (v2 까지만 실행).
         localStorage에 표시해서 한 번만 실행되도록 함. -->
    <script>
      (function() {
        try {
          var KEY = '__bom_sw_reset_v2';
          if (localStorage.getItem(KEY) === '1') return;
          var didWork = false;
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); didWork = true; });
            });
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { didWork = true; return caches.delete(k); }));
            }).then(function() {
              localStorage.setItem(KEY, '1');
              if (didWork) location.reload();
            });
          } else {
            localStorage.setItem(KEY, '1');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
